<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plastic Mitra — Create Account</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="auth.css" />
</head>

<body class="auth-page">

  <div class="card">

    <!-- Logo -->
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M3.6 9h16.8M3.6 15h16.8" />
          <path d="M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18" />
        </svg>
      </div>
      <span class="logo-name">Plastic <em>Mitra</em></span>
    </div>

    <h1 class="card-title">Create an account</h1>
    <p class="card-sub">Join Plastic Mitra and help keep your community clean</p>

    <!-- Tab toggle -->
    <div class="role-toggle" role="tablist" aria-label="Account type">
      <button class="role-btn active" id="tab-user" role="tab" aria-selected="true" aria-controls="panel-user"
        onclick="setTab('user')">User</button>
      <button class="role-btn" id="tab-worker" role="tab" aria-selected="false" aria-controls="panel-worker"
        onclick="setTab('worker')">Worker</button>
    </div>

    <!-- Status message (shared between tabs) -->
    <div class="status-msg" id="status-msg" role="alert"></div>

    <!-- Single form — fields change by tab -->
    <form id="signup-form" onsubmit="handleSignup(event)" novalidate>

      <!-- ── USER TAB ─────────────────────────────── -->
      <div class="tab-panel active" id="panel-user" role="tabpanel">

        <div class="field">
          <label for="u-email">Email</label>
          <input id="u-email" type="email" placeholder="you@example.com" autocomplete="email" />
        </div>

        <div class="field">
          <label for="u-username">Username</label>
          <input id="u-username" type="text" placeholder="your_username" autocomplete="username" />
        </div>

        <div class="field">
          <label for="u-password">Password</label>
          <input id="u-password" type="password" placeholder="At least 6 characters" autocomplete="new-password" />
        </div>

        <div class="field">
          <label for="u-confirm">Confirm password</label>
          <input id="u-confirm" type="password" placeholder="Repeat your password" autocomplete="new-password" />
        </div>

        <!-- Location — users only -->
        <div class="field">
          <label>Home location</label>
          <button type="button" class="btn-location" id="location-btn" onclick="captureLocation()">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3" />
              <path d="M12 2v3M12 19v3M2 12h3M19 12h3" />
              <path d="M12 2a10 10 0 1 0 0 20A10 10 0 0 0 12 2z" stroke-dasharray="3 3" />
            </svg>
            Add current location
          </button>
        </div>

      </div>
      <!-- end user panel -->

      <!-- ── WORKER TAB ───────────────────────────── -->
      <div class="tab-panel" id="panel-worker" role="tabpanel">
        <div class="field">
          <label for="w-email">Email</label>
          <input id="w-email" type="email" placeholder="you@example.com" autocomplete="email" />
        </div>
        <div class="field">
          <label for="w-username">Username</label>
          <input id="w-username" type="text" placeholder="your_username" autocomplete="username" />
        </div>

        <div class="field">
          <label for="w-password">Password</label>
          <input id="w-password" type="password" placeholder="At least 6 characters" autocomplete="new-password" />
        </div>

        <div class="field">
          <label for="w-confirm">Confirm password</label>
          <input id="w-confirm" type="password" placeholder="Repeat your password" autocomplete="new-password" />
        </div>

      </div>
      <!-- end worker panel -->

      <button class="btn-primary" id="submit-btn" type="submit">
        Create account
      </button>

    </form>

    <div class="card-footer">
      Already have an account? <a href="login.html">Sign in</a>
    </div>

  </div>

  <!-- Supabase SDK (must load before config) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Your keys + shared helpers -->
  <script src="supabase-config.js"></script>
  <!-- Page logic -->
  <script src="signup.js"></script>

</body>

</html>
