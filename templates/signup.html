<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlasticMitra – Sign Up</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Baloo+2:wght@700;800&display=swap"
        rel="stylesheet" />
</head>

<body class="auth-body">

    <div class="auth-wrapper">

        <!-- Language Selector -->
        <div class="lang-bar">
            <select id="langSelect" onchange="setLang(this.value)">
                <option value="en">English</option>
                <option value="hi">हिन्दी</option>
                <option value="kn">ಕನ್ನಡ</option>
            </select>
        </div>

        <!-- Logo -->
        <div class="brand">
            <div class="brand-icon">♻️</div>
            <h1 class="brand-name">PlasticMitra</h1>
            <p class="brand-tagline" id="txt-tagline">Clean Village, Green Future</p>
        </div>

        <!-- Card -->
        <div class="auth-card">
            <h2 class="auth-title" id="txt-welcome">Create Account</h2>
            <p class="auth-sub" id="txt-sub">Join your village's clean-up movement</p>

            <form id="signupForm" onsubmit="handleSignup(event)">

                <div class="form-group">
                    <label id="txt-name">Full Name</label>
                    <input type="text" id="signupName" placeholder="Ravi Kumar" required />
                </div>

                <div class="form-group">
                    <label id="txt-village">Village / Town</label>
                    <input type="text" id="signupVillage" placeholder="e.g. Hegde Village" required />
                </div>

                <div class="form-group">
                    <label id="txt-district">District</label>
                    <input type="text" id="signupDistrict" placeholder="e.g. Dakshina Kannada" required />
                </div>

                <div class="form-group">
                    <label id="txt-phone">Phone Number</label>
                    <input type="tel" id="signupPhone" placeholder="9876543210" pattern="[0-9]{10}" required />
                </div>

                <div class="form-group">
                    <label id="txt-email">Email (optional)</label>
                    <input type="email" id="signupEmail" placeholder="you@example.com" />
                </div>

                <div class="form-group">
                    <label id="txt-role">I am a</label>
                    <select id="signupRole">
                        <option value="citizen">Village Citizen</option>
                        <option value="collector">Waste Collector</option>
                        <option value="recycler">Recycler / Scrap Dealer</option>
                        <option value="admin">Panchayat Admin</option>
                    </select>
                </div>

                <div class="form-group">
                    <label id="txt-password">Password</label>
                    <div class="input-eye">
                        <input type="password" id="signupPassword" placeholder="Create a password" required
                            minlength="6" />
                        <button type="button" class="eye-btn" onclick="togglePwd('signupPassword', this)">👁</button>
                    </div>
                </div>

                <div class="form-group">
                    <label id="txt-confirm">Confirm Password</label>
                    <div class="input-eye">
                        <input type="password" id="signupConfirm" placeholder="Repeat password" required
                            minlength="6" />
                        <button type="button" class="eye-btn" onclick="togglePwd('signupConfirm', this)">👁</button>
                    </div>
                </div>

                <div id="signupError" class="error-msg hidden"></div>
                <div id="signupSuccess" class="success-msg hidden"></div>

                <button type="submit" class="btn-primary" id="txt-signupBtn">Create Account</button>

            </form>

            <!-- Voice prompt -->
            <button class="voice-btn" onclick="voicePrompt('signup')" title="Listen to instructions">
                🔊 <span id="txt-voice">Listen to instructions</span>
            </button>

            <p class="auth-switch">
                <span id="txt-haveAccount">Already have an account?</span>
                <a href="login.html" id="txt-login">Login</a>
            </p>
        </div>

    </div>

    <script src="js/i18n.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/voice.js"></script>
    <script>

        function handleSignup(e) {
            e.preventDefault();
            const errEl = document.getElementById('signupError');
            const sucEl = document.getElementById('signupSuccess');
            errEl.classList.add('hidden');
            sucEl.classList.add('hidden');

            const name = document.getElementById('signupName').value.trim();
            const village = document.getElementById('signupVillage').value.trim();
            const district = document.getElementById('signupDistrict').value.trim();
            const phone = document.getElementById('signupPhone').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const role = document.getElementById('signupRole').value;
            const password = document.getElementById('signupPassword').value;
            const confirm = document.getElementById('signupConfirm').value;

            if (password !== confirm) {
                errEl.textContent = 'Passwords do not match.';
                errEl.classList.remove('hidden');
                return;
            }

            const users = JSON.parse(localStorage.getItem('pm_users') || '[]');

            const exists = users.find(u => u.phone === phone || (email && u.email === email));
            if (exists) {
                errEl.textContent = 'An account with this phone or email already exists.';
                errEl.classList.remove('hidden');
                return;
            }

            const newUser = {
                id: 'usr_' + Date.now(),
                name, village, district, phone, email, role, password,
                points: 0,
                badges: [],
                reports: [],
                joinedAt: new Date().toISOString()
            };

            users.push(newUser);
            localStorage.setItem('pm_users', JSON.stringify(users));
            localStorage.setItem('pm_currentUser', JSON.stringify(newUser));

            sucEl.textContent = 'Account created! Redirecting...';
            sucEl.classList.remove('hidden');

            setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);
        }

        function togglePwd(id, btn) {
            const inp = document.getElementById(id);
            inp.type = inp.type === 'password' ? 'text' : 'password';
            btn.textContent = inp.type === 'password' ? '👁' : '🙈';
        }

        if (localStorage.getItem('pm_currentUser')) {
            window.location.href = 'dashboard.html';
        }

    </script>
</body>

</html>
