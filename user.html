<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Central — Plastic Mitra</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/shared.css" />
  <link rel="stylesheet" href="css/user.css" />
</head>
<body>

  <header class="header-nav">
    <h3 id="welcomeHeader">Welcome Back</h3>
    <button class="btn-secondary" id="logoutBtn">Sign Out</button>
  </header>

  <main class="app-container">
    <div class="metrics-grid">
      <div class="stat-card">
        <h3>Available Balance</h3>
        <div class="value" id="pointsVal" style="color:var(--color-accent);">0 XP</div>
      </div>
      <div class="stat-card">
        <h3>Disposal Requests Sent</h3>
        <div class="value" id="pingsVal">0</div>
      </div>
    </div>

    <div class="split-view">
      <div class="panel-main" style="padding:1.5rem; display:flex; flex-direction:column; gap:1.5rem;">
        <div style="text-align:center;">
          <h2 style="margin-bottom:0.5rem; font-size:1.4rem;">Request Waste Disposal Pickup</h2>
          <p style="color:var(--color-text-muted); margin-bottom:1.25rem; font-size:0.9rem;">
            Tap the trigger mechanism below to beam an instant notification locator ping directly to nearest garbage workers.
          </p>
          <button class="btn-primary" id="pingActionBtn"
            style="font-size:1.1rem; padding:1.2rem; max-width:320px; width:100%; margin:0 auto; display:block;">
            ⚡ Request Immediate Pickup
          </button>
          <div id="statusReport" style="margin-top:1rem; font-size:0.9rem; font-weight:500;"></div>
        </div>

        <div id="map"></div>
      </div>

      <div class="panel-sidebar">
        <div class="panel-main" style="padding:1rem;">
          <h3 style="font-size:0.95rem; margin-bottom:1rem; border-bottom:1px solid var(--color-border); padding-bottom:0.5rem;">
            Recent Logs
          </h3>
          <div class="activity-list" id="activityFeed"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="toastContainer"></div>

  <script src="js/supabase-config.js"></script>
  <script src="js/user.js"></script>
</body>
</html>
