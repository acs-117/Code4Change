<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plastic Mitra — Sign In</title>
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/core.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <script src="js/i18n.js"></script>
</head>
<body class="auth-page">
  <div class="card">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M3.6 9h16.8M3.6 15h16.8M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18" /></svg>
      </div>
      <span class="logo-name">Plastic <em>Mitra</em></span>
    </div>

    <div style="text-align:right; margin-bottom:1rem;">
      <select class="lang-select" onchange="setLanguage(this.value)" style="background:var(--color-surface-alt,#1a1a2e);color:var(--color-text-primary,#e2e8f0);border:1px solid var(--color-border,#333);border-radius:6px;padding:0.3rem 0.6rem;font-size:0.85rem;cursor:pointer;">
        <option value="en">English</option>
        <option value="hi">हिंदी</option>
        <option value="kn">ಕನ್ನಡ</option>
      </select>
    </div>

    <h1 class="card-title" data-i18n="login_title">Welcome back</h1>
    <p class="card-sub" data-i18n="login_sub">Sign in to your account to continue</p>

    <div class="role-toggle" role="group" aria-label="Select account type">
      <button class="role-btn active" id="btn-user" onclick="setRole('user')" data-i18n="role_user">User</button>
      <button class="role-btn" id="btn-worker" onclick="setRole('worker')" data-i18n="role_worker">Worker</button>
    </div>

    <div class="status-msg" id="status-msg" role="alert"></div>

    <form id="login-form" onsubmit="handleLogin(event)" novalidate>
      <div class="field">
        <label for="username" data-i18n="label_username">Username</label>
        <input id="username" type="text" placeholder="your_username" data-i18n="label_username" data-i18n-attr="placeholder" required />
      </div>
      <div class="field">
        <label for="email" data-i18n="label_email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" required />
      </div>
      <div class="field">
        <label for="password" data-i18n="label_password">Password</label>
        <input id="password" type="password" placeholder="••••••••" required />
      </div>
      <button class="btn-primary" id="submit-btn" type="submit" data-i18n="btn_sign_in">Sign in</button>
    </form>

    <div class="card-footer"><span data-i18n="login_footer">New here?</span> <a href="signup.html" data-i18n="login_footer_link">Create an account</a></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
