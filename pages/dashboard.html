<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plastic Mitra — Waste Collection Dashboard</title>
    <meta name="description" content="Real-time global waste collection tracking. See live waste pickup pings on an interactive 3D wireframe globe." />

    <!-- Fonts: IBM Plex Sans + Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Dependencies (Globe.gl bundles Three.js internally) -->
    <script src="https://unpkg.com/globe.gl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* ───────── Reset & Tokens ───────── */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary:       #0a0e14;
            --bg-secondary:     #0d1117;
            --bg-glass:         rgba(74, 222, 128, 0.03);
            --bg-glass-hover:   rgba(74, 222, 128, 0.07);
            --border-glass:     rgba(74, 222, 128, 0.10);
            --border-dim:       rgba(255, 255, 255, 0.06);
            --accent:           #4ade80;
            --accent-dim:       rgba(74, 222, 128, 0.12);
            --accent-glow:      rgba(74, 222, 128, 0.25);
            --accent-collected: #38bdf8;
            --text-primary:     #e2e8f0;
            --text-secondary:   rgba(226, 232, 240, 0.50);
            --text-tertiary:    rgba(226, 232, 240, 0.30);
            --font-body:        'IBM Plex Sans', -apple-system, sans-serif;
            --font-mono:        'IBM Plex Mono', monospace;
            --radius-sm:        8px;
            --radius-md:        12px;
            --radius-lg:        18px;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: var(--font-body);
            background: var(--bg-primary);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }

        /* ───────── Grid Background ───────── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background-image:
                linear-gradient(rgba(74, 222, 128, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(74, 222, 128, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        /* ───────── Globe Container ───────── */
        #globeViz {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 0;
        }

        /* ───────── Vignette Overlay ───────── */
        .vignette {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background:
                radial-gradient(ellipse 80% 80% at 50% 50%, transparent 40%, var(--bg-primary) 100%);
        }

        /* ───────── Top Bar ───────── */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            background: linear-gradient(180deg, rgba(10, 14, 20, 0.92) 0%, rgba(10, 14, 20, 0) 100%);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            font-family: var(--font-mono);
            font-size: 20px;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: -0.5px;
        }

        .brand-logo span {
            color: var(--text-secondary);
            font-weight: 400;
        }

        .brand-tag {
            font-size: 10px;
            font-weight: 500;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 2px;
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Live pill */
        .live-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 100px;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 500;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.35; transform: scale(0.75); }
        }

        /* Login */
        #loginBtn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            border: 1px solid var(--border-glass);
            border-radius: 100px;
            background: transparent;
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.25s ease;
        }

        #loginBtn:hover {
            background: var(--bg-glass-hover);
            border-color: var(--accent);
            box-shadow: 0 0 16px var(--accent-glow);
        }

        #loginBtn svg {
            width: 15px;
            height: 15px;
            stroke: var(--accent);
        }

        /* ───────── Stats (Bottom-Left) ───────── */
        .stats-panel {
            position: fixed;
            bottom: 24px;
            left: 24px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 8px;
            animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .stat-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 18px;
            background: rgba(10, 14, 20, 0.75);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            backdrop-filter: blur(14px);
            min-width: 190px;
            transition: all 0.25s ease;
        }

        .stat-card:hover {
            border-color: var(--accent);
            background: var(--bg-glass-hover);
        }

        .stat-icon {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: grid;
            place-items: center;
            font-size: 15px;
            flex-shrink: 0;
        }

        .stat-icon.green  { background: var(--accent-dim); }
        .stat-icon.blue   { background: rgba(56, 189, 248, 0.10); }
        .stat-icon.dim    { background: rgba(226, 232, 240, 0.05); }

        .stat-value {
            font-family: var(--font-mono);
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .stat-label {
            font-size: 10px;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        /* ───────── Legend (Bottom-Right) ───────── */
        .legend-panel {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 100;
            padding: 16px 20px;
            background: rgba(10, 14, 20, 0.75);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            backdrop-filter: blur(14px);
            animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.7s both;
        }

        .legend-panel h3 {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .legend-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: var(--text-secondary);
            padding: 4px 0;
        }

        .legend-ring {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid;
            flex-shrink: 0;
            position: relative;
        }

        .legend-ring.pending {
            border-color: var(--accent);
            box-shadow: 0 0 6px var(--accent-glow);
        }

        .legend-ring.pending::after {
            content: '';
            position: absolute;
            inset: 2px;
            border-radius: 50%;
            background: var(--accent);
        }

        .legend-ring.collected {
            border-color: var(--accent-collected);
            opacity: 0.7;
        }

        /* ───────── Loading ───────── */
        .loader-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .loader-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loader-ring {
            width: 40px;
            height: 40px;
            border: 2px solid var(--border-dim);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loader-text {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-tertiary);
            letter-spacing: 1px;
        }

        /* ───────── Responsive ───────── */
        @media (max-width: 640px) {
            .top-bar { padding: 10px 14px; }
            .brand-tag { display: none; }
            .stats-panel { bottom: 14px; left: 14px; }
            .stat-card { padding: 10px 14px; min-width: 160px; }
            .stat-value { font-size: 17px; }
            .legend-panel { display: none; }
            .live-pill span:last-child { display: none; }
        }
    </style>
</head>

<body>

    <!-- Loader -->
    <div class="loader-overlay" id="loader">
        <div class="loader-ring"></div>
        <div class="loader-text">INITIALIZING GLOBE</div>
    </div>

    <!-- Vignette -->
    <div class="vignette"></div>

    <!-- ─── Top Bar ─── -->
    <nav class="top-bar">
        <div class="brand">
            <div>
                <div class="brand-logo">plastic<span>mitra</span></div>
                <div class="brand-tag">Waste Collection Dashboard</div>
            </div>
        </div>
        <div class="top-bar-right">
            <div class="live-pill">
                <div class="live-dot"></div>
                <span>LIVE</span>
            </div>
            <a href="login.html" id="loginBtn">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                </svg>
                Login
            </a>
        </div>
    </nav>

    <!-- ─── Stats ─── -->
    <div class="stats-panel" id="statsPanel">
        <div class="stat-card">
            <div class="stat-icon green">♻️</div>
            <div>
                <div class="stat-value" id="statTotal">—</div>
                <div class="stat-label">Reports</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon blue">📍</div>
            <div>
                <div class="stat-value" id="statPending">—</div>
                <div class="stat-label">Pending</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon dim">🕐</div>
            <div>
                <div class="stat-value" id="statTime">—</div>
                <div class="stat-label">Updated</div>
            </div>
        </div>
    </div>

    <!-- ─── Legend ─── -->
    <div class="legend-panel">
        <h3>Legend</h3>
        <div class="legend-row">
            <div class="legend-ring pending"></div>
            Pending collection
        </div>
        <div class="legend-row">
            <div class="legend-ring collected"></div>
            Collected
        </div>
    </div>

    <!-- Globe -->
    <div id="globeViz"></div>

    <script>
        // ════════════════ SUPABASE ════════════════
        const SUPABASE_URL = "YOUR_SUPABASE_URL";
        const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

        let sb = null, sbOk = false;
        try {
            if (SUPABASE_URL !== "YOUR_SUPABASE_URL" && SUPABASE_ANON_KEY !== "YOUR_SUPABASE_ANON_KEY") {
                sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                sbOk = true;
            } else {
                console.warn('Supabase not configured — demo mode.');
            }
        } catch (_) {}

        // ════════════════ GLOBE ════════════════
        const el = document.getElementById('globeViz');

        // 1x1 transparent PNG so Globe.gl finishes texture loading instantly
        const BLANK_IMG = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=';

        const globe = Globe()(el)
            .globeImageUrl(BLANK_IMG)
            .backgroundColor('rgba(0,0,0,0)')
            .showAtmosphere(true)
            .atmosphereColor('#4ade80')
            .atmosphereAltitude(0.15)
            .showGraticules(true)

            // Country polygons (wireframe borders)
            .polygonAltitude(0.005)
            .polygonCapColor(() => 'rgba(74, 222, 128, 0.015)')
            .polygonSideColor(() => 'rgba(0,0,0,0)')
            .polygonStrokeColor(() => '#4ade8055')
            .polygonsTransitionDuration(0)

            // Point markers (waste reports)
            .pointsData([])
            .pointAltitude(0.018)
            .pointRadius(0.4)
            .pointColor(d => d.color)
            .pointsMerge(false)

            // Animated ping rings
            .ringsData([])
            .ringColor(() => t => `rgba(74, 222, 128, ${1 - t})`)
            .ringMaxRadius(4)
            .ringPropagationSpeed(2)
            .ringRepeatPeriod(1200);

        // ──── Custom wireframe globe material ────
        // Globe.gl exposes THREE on the window via its bundle
        const T = window.THREE;
        if (T) {
            const globeMaterial = new T.MeshBasicMaterial({
                color: new T.Color('#0d1f15'),
                wireframe: true,
                transparent: true,
                opacity: 0.35
            });
            globe.globeMaterial(globeMaterial);
        }

        // ──── Controls ────
        globe.controls().autoRotate = true;
        globe.controls().autoRotateSpeed = 0.3;
        globe.controls().enableDamping = true;
        globe.controls().dampingFactor = 0.12;
        globe.controls().minDistance = 120;
        globe.controls().maxDistance = 600;
        globe.pointOfView({ lat: 15, lng: 78, altitude: 2.2 });

        // ──── Load country borders ────
        const COUNTRIES_URL = 'https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/ne_110m_admin_0_countries.geojson';

        fetch(COUNTRIES_URL)
            .then(r => r.json())
            .then(geo => {
                globe.polygonsData(geo.features);
            })
            .catch(err => console.warn('Could not load country borders:', err));

        // ──── Loader dismissal ────
        function dismissLoader() {
            const l = document.getElementById('loader');
            if (l && !l.classList.contains('hidden')) l.classList.add('hidden');
        }

        globe.onGlobeReady(() => {
            // Style graticules once globe is ready
            if (T) {
                const scene = globe.scene();
                scene.traverse(obj => {
                    if (obj.type === 'Line' || obj.type === 'LineSegments') {
                        if (obj.material) {
                            obj.material.color = new T.Color('#1a3d28');
                            obj.material.opacity = 0.15;
                            obj.material.transparent = true;
                        }
                    }
                });
            }
            dismissLoader();
        });

        // Fallback: force-dismiss after 2.5s no matter what
        setTimeout(dismissLoader, 2500);

        // ════════════════ MARKER COLORS ════════════════
        function markerColor(status) {
            return status === 'collected' ? '#38bdf8' : '#4ade80';
        }

        // ════════════════ LOAD DATA ════════════════
        async function loadMarkers() {
            if (!sbOk) { loadDemo(); return; }

            try {
                const { data, error } = await sb.from('dashboard').select('*');
                if (error) { console.error(error); return; }
                if (!data || !data.length) { updateStats(0, 0); return; }

                applyData(data);
            } catch (e) {
                console.error('Fetch failed:', e);
            }
        }

        function applyData(rows) {
            const points = rows.map(r => ({
                lat: r.latitude,
                lng: r.longitude,
                color: markerColor(r.status)
            }));

            const rings = rows
                .filter(r => r.status === 'pending')
                .map(r => ({ lat: r.latitude, lng: r.longitude }));

            globe.pointsData(points);
            globe.ringsData(rings);

            const pending = rows.filter(r => r.status === 'pending').length;
            updateStats(rows.length, pending);
        }

        // ════════════════ DEMO DATA ════════════════
        function loadDemo() {
            const demo = [
                // Mangalore / Yenepoya cluster
                { lat: 12.870, lng: 74.842, status: 'pending' },
                { lat: 12.895, lng: 74.836, status: 'pending' },
                { lat: 12.915, lng: 74.860, status: 'collected' },
                { lat: 12.850, lng: 74.880, status: 'pending' },
                // Indian cities
                { lat: 28.613, lng: 77.209, status: 'pending' },
                { lat: 19.076, lng: 72.878, status: 'collected' },
                { lat: 13.083, lng: 80.270, status: 'pending' },
                { lat: 12.972, lng: 77.595, status: 'pending' },
                // Global
                { lat: 51.507, lng: -0.128, status: 'pending' },
                { lat: 40.713, lng: -74.006, status: 'collected' },
                { lat: 35.682, lng: 139.692, status: 'pending' },
                { lat: -33.869, lng: 151.209, status: 'pending' },
                { lat: -1.286, lng: 36.817, status: 'pending' },
                { lat: 48.857, lng: 2.352, status: 'collected' },
                { lat: -23.551, lng: -46.634, status: 'pending' },
            ];
            applyData(demo);
        }

        // ════════════════ STATS ════════════════
        function updateStats(total, pending) {
            document.getElementById('statTotal').textContent = total;
            document.getElementById('statPending').textContent = pending;
            document.getElementById('statTime').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        loadMarkers();

        // ════════════════ REALTIME ════════════════
        if (sbOk) {
            sb.channel('dashboard-rt')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'dashboard' }, () => loadMarkers())
                .subscribe();
        }

        // ════════════════ RESIZE ════════════════
        window.addEventListener('resize', () => {
            globe.width(window.innerWidth);
            globe.height(window.innerHeight);
        });
    </script>

</body>

</html>
