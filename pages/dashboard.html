<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plastic Mitra — Live Ping Dashboard</title>
  <meta name="description" content="Plastic Mitra live global map tracking plastic waste pings across India in real time." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Globe.gl CDN -->
  <script src="https://unpkg.com/globe.gl"></script>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ── Reset & Dark Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:        #4ade80;
      --green-dim:    rgba(74, 222, 128, 0.15);
      --green-glow:   rgba(74, 222, 128, 0.35);
      --gray-dot:     #6b7280;
      --bg:           #000000;
      --surface:      rgba(255,255,255,0.04);
      --surface-border: rgba(74, 222, 128, 0.12);
      --text:         #e2e8f0;
      --text-muted:   #64748b;
      --font: 'IBM Plex Sans', -apple-system, sans-serif;
      --mono: 'IBM Plex Mono', monospace;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .pm-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 2rem;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--surface-border);
    }

    .pm-logo {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #fff;
    }
    .pm-logo span { color: var(--green); }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--green);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .live-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse-dot 1.6s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.75); }
    }

    .pm-exit {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 6px;
      padding: 0.4rem 0.9rem;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
      text-decoration: none;
    }
    .pm-exit:hover { color: var(--green); border-color: var(--green); }

    /* ── Main Layout ── */
    .pm-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-top: 80px; /* clear the fixed header */
      padding-bottom: 2rem;
      width: 100%;
    }

    /* ── Centered content column ── */
    .pm-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 600px;
    }

    /* ── Metrics Strip ── */
    .metrics-strip {
      display: flex;
      gap: 1rem;
      width: 600px;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 10px;
      padding: 1.1rem 1.3rem;
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s;
    }
    .stat-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--green-dim) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .stat-card:hover::before { opacity: 1; }
    .stat-card:hover { border-color: rgba(74,222,128,0.3); }

    .stat-card h3 {
      font-size: 0.68rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 0.55rem;
    }
    .stat-val {
      font-family: var(--mono);
      font-size: 1.9rem;
      font-weight: 700;
      color: #fff;
      line-height: 1;
    }
    .stat-val.green  { color: var(--green); text-shadow: 0 0 18px var(--green-glow); }
    .stat-val.small  { font-size: 1rem; margin-top: 0.35rem; }

    /* ── Globe Hero ── */
    .globe-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .globe-wrap {
      width: 600px;
      height: 600px;
      position: relative;
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%   { transform: translateY(0px); }
      50%  { transform: translateY(-18px); }
      100% { transform: translateY(0px); }
    }

    /* subtle glow halo behind globe */
    .globe-wrap::before {
      content: '';
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: 520px; height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(74,222,128,0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    #globeViz {
      width: 600px;
      height: 600px;
      position: relative;
      z-index: 1;
      background: transparent !important;
    }
    /* Remove any canvas background Globe.gl sets */
    #globeViz canvas { background: transparent !important; }

    /* Globe tooltips */
    .scene-tooltip {
      background: rgba(0,0,0,0.85) !important;
      border: 1px solid var(--surface-border) !important;
      color: #fff !important;
      font-family: var(--font) !important;
      padding: 0.5rem 0.8rem !important;
      border-radius: 6px !important;
      font-size: 0.8rem !important;
      backdrop-filter: blur(8px) !important;
      pointer-events: none;
    }

    /* ── Caption beneath globe ── */
    .globe-caption {
      margin-top: 1rem;
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-align: center;
    }
    .globe-caption span { color: var(--green); }

    /* ── Toast ── */
    #toastContainer {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .toast {
      background: rgba(0,0,0,0.9);
      border: 1px solid var(--surface-border);
      border-left: 3px solid var(--green);
      backdrop-filter: blur(12px);
      color: var(--text);
      padding: 0.65rem 1.1rem;
      border-radius: 8px;
      font-size: 0.82rem;
      font-family: var(--mono);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      animation: slideIn 0.3s ease;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    @keyframes slideIn {
      from { transform: translateX(60px); opacity: 0; }
      to   { transform: translateX(0);    opacity: 1; }
    }

    /* ── Responsive ── */
    @media (max-width: 660px) {
      .globe-wrap, #globeViz { width: 340px; height: 340px; }
      .metrics-strip { flex-direction: column; max-width: 340px; }
    }
  </style>
</head>
<body>

  <!-- ── Header ── -->
  <header class="pm-header" role="banner">
    <div class="pm-logo">Plastic <span>Mitra</span></div>
    <div class="live-badge">
      <div class="live-dot" id="liveDot"></div>
      <span>Live</span>
    </div>
    <a href="../login.html" class="pm-exit" id="exitBtn">Exit Overview</a>
  </header>

  <!-- ── Main ── -->
  <main class="pm-main" id="mainContent">

    <div class="pm-center">
      <!-- Metrics -->
      <div class="metrics-strip" role="region" aria-label="Ping statistics">
        <div class="stat-card" id="cardTotal">
          <h3>Total Pings</h3>
          <div class="stat-val" id="statTotal">—</div>
        </div>
        <div class="stat-card" id="cardPending">
          <h3>Pending Cleanups</h3>
          <div class="stat-val green" id="statPending">—</div>
        </div>
        <div class="stat-card" id="cardTime">
          <h3>Last Synced</h3>
          <div class="stat-val small" id="statTime">—</div>
        </div>
      </div>

      <!-- Globe -->
      <section class="globe-hero" aria-label="Live waste ping globe">
        <div class="globe-wrap" id="globeWrap">
          <div id="globeViz"></div>
        </div>
        <p class="globe-caption">
          <span id="captionCount">0</span> active pings across India · auto-rotating
        </p>
      </section>
    </div>

  </main>

  <!-- Toast container -->
  <div id="toastContainer" role="status" aria-live="polite"></div>

  <script>
    /* ──────────────────────────────────────────
       CONFIG — fill in your Supabase credentials
    ────────────────────────────────────────── */
    const SUPABASE_URL  = 'https://wzdroididrergcjiwoty.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6ZHJvaWRpZHJlcmdjaml3b3R5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2OTQzNDMsImV4cCI6MjA5NTI3MDM0M30.tvOulsFaLx9-9T-NDyoD0_hOqJL7IRpKNpTUdL48jWU';

    /* ──────────────────────────────────────────
       STATE
    ────────────────────────────────────────── */
    let wastePoints = [];   // { lat, lng, status }
    let globe = null;
    let sb = null;

    /* ──────────────────────────────────────────
       SUPABASE INIT
    ────────────────────────────────────────── */
    try {
      sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch(e) {
      console.warn('Supabase init failed:', e);
    }

    /* ──────────────────────────────────────────
       GLOBE INIT
    ────────────────────────────────────────── */
    function initGlobe() {
      globe = Globe({ animateIn: false })(document.getElementById('globeViz'))
        .width(600)
        .height(600)
        /* Night earth texture — city lights */
        .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')

        /* No atmosphere ring */
        .showAtmosphere(false)

        /* Transparent canvas background */
        .backgroundColor('rgba(0,0,0,0)')

        /* Point markers */
        .pointsData([])
        .pointLat(p => p.lat)
        .pointLng(p => p.lng)
        .pointColor(p => p.status === 'collected' ? '#6b7280' : '#4ade80')
        .pointAltitude(0.012)
        .pointRadius(p => p.status === 'collected' ? 0.28 : 0.38)
        .pointsMerge(false)
        .pointResolution(12)
        /* Add hover labels to make it feel more interactive */
        .pointLabel(p => `
          <div style="text-align: center;">
            <b style="color: ${p.status === 'collected' ? '#6b7280' : '#4ade80'}">
              ${p.status === 'collected' ? 'Collected' : 'Pending'}
            </b><br/>
            Lat: ${Number(p.lat).toFixed(3)}, Lng: ${Number(p.lng).toFixed(3)}
          </div>
        `);

      /* Camera — start centred on India */
      globe.pointOfView({ lat: 20, lng: 78, altitude: 2.2 }, 0);

      /* Controls — allow zooming and panning */
      const controls = globe.controls();
      controls.enableZoom = true;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.4;
      controls.enablePan = true;
      controls.minDistance = 120; // don't zoom into the core
      controls.maxDistance = 400; // don't zoom out too far
      controls.minPolarAngle = Math.PI * 0.15;
      controls.maxPolarAngle = Math.PI * 0.85;

      /* Kill atmosphere / bg renderer if it slips through */
      try {
        const renderer = globe.renderer();
        renderer.setClearColor(0x000000, 0);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      } catch(_) {}
    }

    /* ──────────────────────────────────────────
       RENDER POINTS
    ────────────────────────────────────────── */
    function renderPoints() {
      if (!globe) return;
      globe.pointsData([...wastePoints]);

      const pending = wastePoints.filter(p => p.status !== 'collected').length;
      document.getElementById('statTotal').textContent   = wastePoints.length;
      document.getElementById('statPending').textContent = pending;
      document.getElementById('statTime').textContent    = new Date().toLocaleTimeString();
      document.getElementById('captionCount').textContent = pending;
    }

    /* ──────────────────────────────────────────
       INITIAL LOAD FROM SUPABASE
    ────────────────────────────────────────── */
    async function loadInitialData() {
      if (!sb) {
        useFallback();
        return;
      }
      try {
        const { data, error } = await sb
          .from('dashboard')
          .select('latitude, longitude, status');

        if (error) throw error;

        if (data && data.length > 0) {
          wastePoints = data.map(r => ({
            lat: r.latitude,
            lng: r.longitude,
            status: r.status || 'pending'
          }));
        } else {
          useFallback();
        }
      } catch(e) {
        console.warn('Load error:', e);
        useFallback();
      }
      renderPoints();
    }

    function useFallback() {
      wastePoints = [
        { lat: 28.613,  lng: 77.209,  status: 'pending'   },   // Delhi
        { lat: 19.076,  lng: 72.877,  status: 'pending'   },   // Mumbai
        { lat: 12.971,  lng: 77.594,  status: 'collected' },   // Bangalore
        { lat: 22.572,  lng: 88.363,  status: 'pending'   },   // Kolkata
        { lat: 13.082,  lng: 80.270,  status: 'collected' },   // Chennai
        { lat: 17.385,  lng: 78.486,  status: 'pending'   },   // Hyderabad
        { lat: 23.022,  lng: 72.571,  status: 'pending'   },   // Ahmedabad
        { lat: 18.520,  lng: 73.856,  status: 'collected' },   // Pune
        { lat: 26.846,  lng: 80.946,  status: 'pending'   },   // Lucknow
        { lat: 25.317,  lng: 82.974,  status: 'pending'   },   // Varanasi
      ];
    }

    /* ──────────────────────────────────────────
       SUPABASE REALTIME SUBSCRIPTION
    ────────────────────────────────────────── */
    function subscribeRealtime() {
      if (!sb) return;

      sb.channel('dashboard-pings')
        .on(
          'postgres_changes',
          { event: '*', schema: 'public', table: 'dashboard' },
          (payload) => {
            const ev = payload.eventType;
            const row = payload.new || payload.old;

            if (ev === 'INSERT') {
              const point = {
                lat: row.latitude,
                lng: row.longitude,
                status: row.status || 'pending'
              };
              wastePoints.push(point);
              toast(`📍 New ping — ${point.lat.toFixed(3)}, ${point.lng.toFixed(3)}`);
              
              // Move camera to new point
              globe.pointOfView({ lat: point.lat, lng: point.lng, altitude: 1.5 }, 1000);
            } else if (ev === 'UPDATE') {
              const idx = wastePoints.findIndex(
                p => Math.abs(p.lat - row.latitude) < 0.001 &&
                     Math.abs(p.lng - row.longitude) < 0.001
              );
              if (idx !== -1) {
                wastePoints[idx].status = row.status;
                toast(`✅ Ping collected — ${row.latitude.toFixed(3)}, ${row.longitude.toFixed(3)}`);
              }
            } else if (ev === 'DELETE') {
              const old = payload.old;
              wastePoints = wastePoints.filter(
                p => !(Math.abs(p.lat - old.latitude) < 0.001 &&
                       Math.abs(p.lng - old.longitude) < 0.001)
              );
            }

            renderPoints();
          }
        )
        .subscribe(status => {
          if (status === 'SUBSCRIBED') {
            document.getElementById('liveDot').style.background = '#4ade80';
          } else if (status === 'CHANNEL_ERROR') {
            document.getElementById('liveDot').style.background = '#ef4444';
          }
        });
    }

    /* ──────────────────────────────────────────
       TOAST
    ────────────────────────────────────────── */
    function toast(msg, duration = 4000) {
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = msg;
      const container = document.getElementById('toastContainer');
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateX(60px)';
        el.style.transition = 'all 0.35s ease';
        setTimeout(() => el.remove(), 360);
      }, duration);
    }

    /* ──────────────────────────────────────────
       BOOT
    ────────────────────────────────────────── */
    window.addEventListener('load', () => {
      initGlobe();
      loadInitialData().then(() => {
        subscribeRealtime();
      });
    });
  </script>
</body>
</html>
